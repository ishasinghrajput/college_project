{% extends 'base.html' %}

{% block title %}Chat Room{% endblock %}

{% block content %}

<style>
    .chat-box {
        height: 65vh;
        overflow-y: auto;
        background: #f8fafc;
        padding: 15px;
        border-radius: 12px;
    }

    .msg {
        padding: 8px 12px;
        margin-bottom: 10px;
        border-radius: 10px;
        max-width: 60%;
        font-size: 14px;
    }

    .me {
        background: #dcf8c6;
        margin-left: auto;
        text-align: right;
    }

    .other {
        background: #fff;
        border: 1px solid #ddd;
    }

    .chat-input {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .chat-input input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    .chat-input button {
        padding: 10px 18px;
        border: none;
        background: #0d6efd;
        color: white;
        border-radius: 8px;
    }
</style>

<div class="container py-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>{{ room.post.title }}</h4>

        <a href="{% url 'my_chats' %}" class="btn btn-sm btn-light">
            ← Back
        </a>
    </div>

    <!-- CHAT BOX -->
    <div class="chat-box">

        {% for msg in messages %}

            <div class="msg {% if msg.sender.id == student.id %}me{% else %}other{% endif %}">
                <b>{{ msg.sender.username }}</b><br>
                {{ msg.text }}
            </div>

        {% empty %}
            <p class="text-center text-muted">No messages yet</p>
        {% endfor %}

    </div>

    <!-- INPUT BOX -->
    <form method="POST" class="chat-input">
        {% csrf_token %}

        <input type="text" name="message" placeholder="Type your message..." required>

        <button type="submit">Send</button>
    </form>

</div>

{% endblock %}
