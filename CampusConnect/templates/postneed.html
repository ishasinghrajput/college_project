{% extends 'base.html' %}

{% block extra_css %}
<style>
    body {
        background: #f5f7ff;
    }
    
    /* Form Container Layout Match */
    .form-card {
        border: none;
        border-radius: 20px;
        background: white;
        box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        padding: 35px;
        margin-top: 40px;
        background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(245,247,255,1) 100%);
    }

    /* Custom Input Controls Styling */
    .form-control, .form-select {
        border-radius: 12px;
        padding: 12px;
        border: 1px solid #ced4da;
        background-color: #ffffff;
    }

    .form-control:focus, .form-select:focus {
        border-color: #6c63ff;
        box-shadow: 0 0 0 0.25rem rgba(108, 99, 255, 0.25);
    }

    /* Primary Submit Action Button */
    .submit-btn {
        background: linear-gradient(135deg, #6c63ff, #5f8dff);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 25px;
        font-weight: 600;
        transition: 0.3s;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(108, 99, 255, 0.3);
        color: white;
    }

    /* Cancel Secondary Button */
    .cancel-btn {
        border-radius: 12px;
        padding: 12px 25px;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="form-card mt-5">
                <h3 class="fw-bold mb-2 text-dark">
                    <i class="bi bi-pencil-square text-primary me-2"></i>Post Your Need
                </h3>
                <p class="text-muted small mb-4">
                    Post your requirements clearly. Peers can click the help button to connect via chat. 
                    <span class="text-warning fw-bold d-block mt-1"><i class="bi bi-award-fill"></i> Solving Reward: 10 Points</span>
                </p>
                
                <!-- Action endpoint sets to post process configuration handler -->
                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- REQUEST TITLE -->
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Title (What do you need?)</label>
                        <input type="text" name="title" class="form-control" placeholder="e.g., Need DBMS Unit 3 Handwritten Notes" required>
                    </div>

                    <!-- REQ CATEGORY DROPDOWN -->
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Category</label>
                        <select name="category" class="form-select" required>
                            <option value="Notes">Notes Requirement</option>
                            <option value="Coding">Coding Doubt</option>
                            <option value="Assignment">Assignment Help</option>
                            <option value="Updates">Classroom Update</option>
                            <option value="Campus Queries">Campus Query / Enquiry</option>
                        </select>
                    </div>

                    <!-- COMPREHENSIVE TEXT DETAILS -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">Description (Add Details)</label>
                        <textarea name="description" class="form-control" rows="5" placeholder="Explain your issues, mention books, topics or specific assignment constraints..." required></textarea>
                    </div>

                    <!-- FOOTER ACTIONS INTEGRATION -->
                    <div class="d-flex gap-3 justify-content-end">
                        <a href="{% url 'allrequest' %}" class="btn btn-light text-muted cancel-btn">Cancel</a>
                        <button type="submit" class="btn submit-btn flex-grow-1 flex-sm-grow-0">Submit Request</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
