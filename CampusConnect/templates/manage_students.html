<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7ff, #eef2ff);
        }

        .page-header {
            background: #fff;
            padding: 18px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .student-card {
            border: none;
            border-radius: 16px;
            transition: 0.3s;
            box-shadow: 0 8px 18px rgba(0,0,0,0.06);
            background: #fff;
        }

        .student-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #4f46e5;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .delete-btn {
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container my-5">

    <!-- HEADER -->
    <div class="page-header d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0">
            <i class="bi bi-people-fill text-primary me-2"></i>
            Manage Students
        </h3>

        <a href="{% url 'admin_dashboard' %}" class="btn btn-dark btn-sm">
            Back
        </a>
    </div>

    <!-- STUDENTS -->
    <div class="row">

        {% for student in students %}
        <div class="col-md-4 mb-3">

            <div class="card student-card p-3">

                <div class="d-flex align-items-center gap-3">

                    <!-- Avatar -->
                    <div class="avatar">
                        {{ student.username|slice:":1"|upper }}
                    </div>

                    <!-- Info -->
                    <div class="flex-grow-1">
                        <h6 class="mb-1 fw-bold">{{ student.full_name }}</h6>

                        <p class="mb-0 text-muted small">
                            <i class="bi bi-person"></i> {{ student.username }}
                        </p>

                        <p class="mb-0 text-muted small">
                            <i class="bi bi-envelope"></i> {{ student.email }}
                        </p>
                    </div>

                </div>

                <!-- DELETE BUTTON -->
                <div class="mt-3 text-end">
                    <a href="{% url 'delete_student' student.id %}"
                       class="btn btn-danger btn-sm delete-btn"
                       onclick="return confirm('Are you sure you want to delete this student?');">

                        <i class="bi bi-trash me-1"></i> Delete
                    </a>
                </div>

            </div>

        </div>

        {% empty %}
        <p class="text-muted text-center">No students found</p>
        {% endfor %}

    </div>

</div>

</body>
</html>
