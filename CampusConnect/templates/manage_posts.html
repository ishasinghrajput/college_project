<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Posts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7ff, #eef2ff);
        }

        .page-header {
            background: #fff;
            padding: 18px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .post-card {
            border: none;
            border-radius: 16px;
            transition: 0.3s;
            box-shadow: 0 8px 18px rgba(0,0,0,0.06);
            background: #fff;
        }

        .post-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }

        .delete-btn {
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container my-5">

    <!-- HEADER -->
    <div class="page-header d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0">
            <i class="bi bi-journal-text text-primary me-2"></i>
            Manage Posts
        </h3>

        <a href="{% url 'admin_dashboard' %}" class="btn btn-dark btn-sm">
            Back
        </a>
    </div>

    <!-- POSTS -->
    <div class="row">

        {% for post in posts %}
        <div class="col-md-6 mb-3">

            <div class="card post-card">

                <div class="card-body p-4">

                    <!-- TITLE -->
                    <h5 class="fw-bold mb-2">
                        {{ post.title }}
                    </h5>

                    <!-- CATEGORY -->
                    <span class="badge bg-info text-dark mb-3 px-3 py-2">
                        {{ post.category }}
                    </span>

                    <!-- DESCRIPTION -->
                    <p class="text-muted small mb-3">
                        {{ post.description|truncatechars:120 }}
                    </p>

                    <!-- USER -->
                    <p class="mb-1">
                        <i class="bi bi-person"></i>
                        {{ post.student.username }}
                    </p>

                    <!-- DATE -->
                    <p class="text-muted small mb-3">
                        <i class="bi bi-calendar3"></i>
                        {{ post.created_at|date:"d M Y" }}
                    </p>

                    <!-- DELETE BUTTON -->
                    <a href="{% url 'delete_post' post.id %}"
                       class="btn btn-danger btn-sm delete-btn"
                       onclick="return confirm('Are you sure you want to delete this post?');">

                        <i class="bi bi-trash me-1"></i> Delete
                    </a>

                </div>

            </div>

        </div>

        {% empty %}
        <p class="text-muted text-center">No posts available</p>
        {% endfor %}

    </div>

</div>

</body>
</html>
