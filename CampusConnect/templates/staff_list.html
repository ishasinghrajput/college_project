<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Staff List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #f5f7ff, #eef2ff);
        }

        .page-header {
            background: #ffffff;
            padding: 18px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .staff-card {
            border: none;
            border-radius: 16px;
            transition: 0.3s;
            box-shadow: 0 8px 18px rgba(0,0,0,0.06);
        }

        .staff-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #3b82f6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container my-5">

    <!-- HEADER -->
    <div class="page-header d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0">
            <i class="bi bi-person-badge text-success me-2"></i>
            Staff List
        </h3>

        <a href="{% url 'admin_dashboard' %}" class="btn btn-dark btn-sm">
            Back
        </a>
    </div>

    <!-- STAFF LIST -->
    <div class="row">

        {% for staff in staffs %}
        <div class="col-md-4 mb-3">

            <div class="card staff-card p-3">

                <div class="d-flex align-items-center gap-3">

                    <!-- Avatar -->
                    <div class="avatar">
                        {{ staff.username|slice:":1"|upper }}
                    </div>

                    <!-- Info -->
                    <div>
                        <h6 class="mb-1 fw-bold">{{ staff.full_name }}</h6>

                        <p class="mb-0 text-muted small">
                            <i class="bi bi-person"></i> {{ staff.username }}
                        </p>

                        <p class="mb-0 text-muted small">
                            <i class="bi bi-envelope"></i> {{ staff.email }}
                        </p>
                    </div>

                </div>

                <!-- ROLE BADGE -->
                <div class="mt-3">
                    <span class="badge bg-success px-3 py-2">
                        {{ staff.role }}
                    </span>
                </div>

            </div>

        </div>

        {% empty %}
        <p class="text-muted text-center">No staff found</p>
        {% endfor %}

    </div>

</div>

</body>
</html>
